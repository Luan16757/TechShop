<div class="delivery-options checkout-full">
    <div class="delivery-title">
        🚚 Forma de entrega
    </div>

    <label class="delivery-option">
        <input
            type="radio"
            name="tipoEntrega"
            id="entregaNormal"
            value="normal"
            checked
        >

        <span class="delivery-option-content">
            <strong>📦 Entrega normal</strong>
            <small id="textoFreteNormal">
                Verificando frete...
            </small>
        </span>
    </label>

    <label class="delivery-option">
        <input
            type="radio"
            name="tipoEntrega"
            id="entregaRapida"
            value="rapida"
        >

        <span class="delivery-option-content">
            <strong>⚡ Entrega rápida</strong>
            <small id="textoFreteRapida">
                + R$ 10,00 sobre o frete normal
            </small>
        </span>
    </label>
</div>
