name: TECHSHOP Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install
        run: npm install

      - name: Corrigir server.cjs
        shell: python
        run: |
          from pathlib import Path

          path = Path("server.cjs")
          text = path.read_text(encoding="utf-8")

          start = text.find("function exigirCliente(")
          end = text.find("/* =========================================================\\n   ADMIN", start)

          if start == -1 or end == -1:
              raise SystemExit("Bloco exigirCliente não encontrado.")

          new_block = '''async function exigirCliente(
              req,
              res,
              next
          ) {
              try {
                  if (IS_NETLIFY) {
                      await carregarDadosNetlify(false);
                  }

                  const token =
                      obterCookie(
                          req,
                          "techshop_cliente"
                      );

                  if (!token) {
                      return res.status(401).json({
                          erro: "Cliente não autenticado."
                      });
                  }

                  const sessao =
                      verificarToken(
                          token,
                          "cliente"
                      );

                  if (!sessao?.id) {
                      return res.status(401).json({
                          erro: "Sessão expirada."
                      });
                  }

                  const usuarios =
                      lerJSON(
                          usuariosFile,
                          []
                      );

                  const usuario =
                      usuarios.find(
                          u =>
                              String(u.id) ===
                              String(sessao.id)
                      );

                  if (!usuario) {
                      return res.status(401).json({
                          erro: "Usuário não encontrado."
                      });
                  }

                  req.usuario = usuario;

                  return next();
              } catch (erro) {
                  console.error(
                      "Erro autenticando cliente:",
                      erro?.stack || erro
                  );

                  return res.status(500).json({
                      erro: "Não foi possível validar a sessão.",
                      detalhe: erro?.message || "Erro interno."
                  });
              }
          }

          '''

          path.write_text(text[:start] + new_block + text[end:], encoding="utf-8")
      
      - name: Corrigir redirects
        shell: python
        run: |
          from pathlib import Path
          path = Path("netlify.toml")
          text = path.read_text(encoding="utf-8")
          old = '''[[redirects]]
          from = "/api/pix"
          to = "/.netlify/functions/pix"
          status = 200
          force = true

          '''
          text = text.replace(old, "")
          old2 = '''[[redirects]]
          from = "/api/pix"
          to = "/.netlify/functions/pix"
          status = 200

          '''
          text = text.replace(old2, "")
          path.write_text(text, encoding="utf-8")

      - name: Check JavaScript syntax
        run: |
          node --check server.cjs
          node --check netlify/functions/api.cjs
          node --check netlify/functions/pix.js
          node --check netlify/functions/produtos.js
          node --check script.js

      - name: Check required files
        run: |
          test -f techshop.html
          test -f script.js
          test -f server.cjs
          test -f netlify.toml
          test -f package.json
          test -f netlify/functions/api.cjs
          test -f netlify/functions/produtos.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git add server.cjs netlify.toml
          git commit -m "Corrige sessao e rota Pix do TechShop"
          git push

      - name: Create project ZIP
        run: |
          zip -qr TECHSHOP-corrigido.zip .             -x ".git/*"             -x "node_modules/*"             -x "TECHSHOP-corrigido.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TECHSHOP-corrigido
          path: TECHSHOP-corrigido.zip
