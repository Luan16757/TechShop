[build]
  publish = "."
  functions = "netlify/functions"

# Deixe o Build command vazio no painel do Netlify.
# As Functions já estão prontas em netlify/functions.

[[redirects]]
  from = "/api/pix"
  to = "/.netlify/functions/pix"
  status = 200

[[redirects]]
  from = "/api/produtos"
  to = "/.netlify/functions/produtos"
  status = 200
