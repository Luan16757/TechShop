[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/pix"
  to = "/.netlify/functions/pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/produtos"
  to = "/.netlify/functions/produtos"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true